<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NagarSeva - Citizen Profile Setup</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .card-hover { transition: all 0.2s ease; }
        .card-hover:hover { transform: translateY(-2px); }
    </style>
</head>
<body class="bg-slate-950 flex items-center justify-center min-h-screen font-sans">

    <!-- Mobile Frame Box -->
    <div class="w-[360px] h-[715px] bg-[#FAF8F5] text-slate-900 rounded-[40px] flex flex-col justify-between shadow-2xl border-4 border-slate-800 relative overflow-hidden">
        
        <!-- Top App Bar -->
        <div class="px-5 pt-3.5 pb-2 flex items-center justify-between bg-[#FAF8F5]/90 backdrop-blur-md z-10 border-b border-amber-900/10">
            <button onclick="history.back()" class="w-7 h-7 bg-amber-100 border border-amber-900/20 rounded-full flex items-center justify-center text-xs font-bold text-[#3B2922]">
                ←
            </button>
            <h1 class="text-sm font-serif font-bold text-[#3B2922] tracking-tight">Citizen <span class="text-amber-800">Profile</span></h1>
            <div class="w-7 h-7 bg-amber-100/60 border border-amber-900/20 rounded-full flex items-center justify-center shadow-sm">
                <span class="text-xs">👤</span>
            </div>
        </div>

        <!-- Scrollable Content Area -->
        <div class="px-4 overflow-y-auto hide-scrollbar space-y-3.5 py-3 flex-grow">
            
            <!-- Profile Avatar & Header Card -->
            <div class="bg-gradient-to-r from-[#3B2922] to-[#5a3f35] text-white p-4 rounded-3xl shadow-lg text-center relative overflow-hidden space-y-2">
                <div class="absolute -right-6 -bottom-6 w-24 h-24 bg-amber-500/10 rounded-full blur-xl"></div>
                
                <!-- Avatar Circle with Camera Icon -->
                <div class="relative w-16 h-16 mx-auto">
                    <div class="w-16 h-16 rounded-full bg-amber-200 text-[#3B2922] flex items-center justify-center font-black text-xl shadow-inner border-2 border-amber-400">
                        RD
                    </div>
                    <div onclick="alert('📸 Upload profile picture clicked!')" class="absolute bottom-0 right-0 w-6 h-6 bg-amber-500 hover:bg-amber-400 text-[#3B2922] rounded-full flex items-center justify-center text-xs shadow cursor-pointer font-bold border border-white">
                        📷
                    </div>
                </div>

                <div class="relative z-10">
                    <h2 class="text-sm font-bold tracking-tight">Rahul Dubey</h2>
                    <p class="text-[10px] text-amber-200">Bhilai Municipal Cooperative Citizen</p>
                </div>
            </div>

            <!-- Profile Details Form -->
            <div class="bg-white border border-amber-900/15 rounded-2xl p-3.5 shadow-sm space-y-3 text-xs">
                <h3 class="text-xs font-bold text-[#3B2922] uppercase tracking-wider border-b border-slate-100 pb-1.5">Personal & Location Details</h3>

                <div class="space-y-2.5">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-600 mb-1">Full Name</label>
                        <input type="text" value="Rahul Dubey" class="w-full p-2 bg-slate-50 border border-amber-900/15 rounded-xl font-medium text-xs focus:outline-none focus:border-[#3B2922]">
                    </div>

                    <div>
                        <label class="block text-[10px] font-bold text-slate-600 mb-1">Phone Number</label>
                        <input type="text" value="+91 98271 XXXXX" class="w-full p-2 bg-slate-50 border border-amber-900/15 rounded-xl font-medium text-xs focus:outline-none focus:border-[#3B2922]">
                    </div>

                    <div>
                        <label class="block text-[10px] font-bold text-slate-600 mb-1">Service Area / Location</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-2.5 flex items-center text-xs">📍</span>
                            <input type="text" value="Smriti Nagar, Bhilai, Chhattisgarh" class="w-full pl-8 pr-2 p-2 bg-slate-50 border border-amber-900/15 rounded-xl font-medium text-xs focus:outline-none focus:border-[#3B2922]">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Trust Badge Box -->
            <div class="bg-amber-50/80 border border-amber-900/20 rounded-2xl p-3 flex items-center space-x-3 shadow-sm">
                <div class="w-9 h-9 rounded-xl bg-amber-200/80 text-[#3B2922] flex items-center justify-center text-base shrink-0">
                    🛡️
                </div>
                <div>
                    <h4 class="text-xs font-bold text-[#3B2922]">Verified Cooperative Account</h4>
                    <p class="text-[9px] text-slate-600 leading-tight mt-0.5">Zero middleman commission on all municipal requests.</p>
                </div>
            </div>

            <!-- LOGOUT / SWITCH ROLE BUTTON (Points directly to login.html) -->
            <div class="pt-1">
                <a href="login.html" onclick="return confirm('Are you sure you want to log out and switch role?')" class="block w-full py-2.5 bg-rose-50 hover:bg-rose-100 text-rose-800 border border-rose-900/20 rounded-xl font-bold text-xs text-center shadow-sm transition">
                    🚪 Log Out & Switch Role (Citizen / Worker)
                </a>
            </div>

        </div>

        <!-- Save Button Footer -->
        <div class="bg-white border-t border-amber-900/10 px-4 py-2.5 z-10 shadow-lg">
            <button onclick="alert('✅ Profile updated successfully!'); window.location.href='dashboard.html';" class="w-full py-2.5 bg-[#3B2922] hover:bg-[#5a3f35] text-white font-bold text-xs rounded-xl shadow-lg transition">
                Save & Continue to Dashboard ➔
            </button>
        </div>

    </div>
</body>
</html>
