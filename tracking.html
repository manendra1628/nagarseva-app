<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NagarSeva - Live GPS Tracking</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-950 flex items-center justify-center min-h-screen font-sans">

    <!-- Mobile Frame Box -->
    <div class="w-[360px] h-[715px] bg-[#FAF8F5] text-slate-900 rounded-[40px] flex flex-col justify-between shadow-2xl border-4 border-slate-800 relative overflow-hidden">
        
        <!-- Top App Bar -->
        <div class="px-5 pt-3.5 pb-2 flex items-center justify-between bg-[#FAF8F5]/90 backdrop-blur-md z-10 border-b border-amber-900/10">
            <a href="booking.html" class="w-7 h-7 bg-amber-100 border border-amber-900/20 rounded-full flex items-center justify-center text-xs font-bold text-[#3B2922]">
                ←
            </a>
            <h1 class="text-sm font-serif font-bold text-[#3B2922] tracking-tight">Live GPS <span class="text-amber-800">Tracking</span></h1>
            <div class="w-7 h-7 bg-amber-100/60 border border-amber-900/20 rounded-full flex items-center justify-center shadow-sm">
                <span class="text-xs">📍</span>
            </div>
        </div>

        <!-- Simulated Map Area (Full Rich UI) -->
        <div class="relative flex-grow bg-slate-200 overflow-hidden flex flex-col items-center justify-center">
            
            <!-- Map Grid & Simulated Background -->
            <div class="absolute inset-0 opacity-40 bg-[radial-gradient(#3B2922_1px,transparent_1px)] [background-size:16px_16px]"></div>
            
            <!-- Simulated Google Map Pin Animation -->
            <div class="relative z-10 text-center space-y-2 animate-bounce">
                <div class="w-12 h-12 bg-[#3B2922] text-amber-400 rounded-full flex items-center justify-center text-xl shadow-2xl border-2 border-white mx-auto">
                    🛵
                </div>
                <span class="bg-amber-900 text-amber-100 text-[9px] font-bold px-2 py-0.5 rounded-full shadow">Vikram Singh is 400m away</span>
            </div>

            <!-- Floating Status Card at Bottom of Map -->
            <div class="absolute bottom-3 left-3 right-3 bg-white/95 backdrop-blur-md border border-amber-900/15 p-3 rounded-2xl shadow-xl z-20 space-y-2">
                <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-2.5">
                        <div class="w-9 h-9 rounded-xl bg-amber-100 text-[#3B2922] flex items-center justify-center font-black text-xs shadow-inner">
                            VS
                        </div>
                        <div>
                            <h4 class="text-xs font-bold text-[#3B2922]">Vikram Singh • Electrician</h4>
                            <p class="text-[9px] text-emerald-700 font-bold">ETA: 4 Minutes remaining</p>
                        </div>
                    </div>
                    <a href="tel:9827100000" class="w-8 h-8 rounded-full bg-amber-100 text-[#3B2922] flex items-center justify-center text-xs shadow hover:bg-amber-200">
                        📞
                    </a>
                </div>
                <div class="w-full bg-slate-100 h-1.5 rounded-full overflow-hidden">
                    <div class="bg-emerald-600 h-full w-[75%] animate-pulse"></div>
                </div>
            </div>

        </div>

        <!-- Bottom Navigation Bar -->
        <div class="bg-white border-t border-amber-900/10 px-3 py-2 flex justify-between items-center z-10 shadow-lg">
            <a href="dashboard.html" class="flex flex-col items-center text-slate-400 hover:text-[#3B2922] transition">
                <span class="text-base">🏠</span>
                <span class="text-[9px] font-medium mt-0.5">Home</span>
            </a>
            <a href="category.html?cat=plumbing" class="flex flex-col items-center text-slate-400 hover:text-[#3B2922] transition">
                <span class="text-base">🛠️</span>
                <span class="text-[9px] font-medium mt-0.5">Services</span>
            </a>
            <a href="role-select.html" class="flex flex-col items-center text-slate-400 hover:text-[#3B2922] transition">
                <span class="text-base">🤖</span>
                <span class="text-[9px] font-medium mt-0.5">ML Match</span>
            </a>
            <a href="booking.html" class="flex flex-col items-center text-[#3B2922]">
                <span class="text-base">📅</span>
                <span class="text-[9px] font-extrabold mt-0.5">Bookings</span>
            </a>
            <a href="profile.html" class="flex flex-col items-center text-slate-400 hover:text-[#3B2922] transition">
                <span class="text-base">👤</span>
                <span class="text-[9px] font-medium mt-0.5">Profile</span>
            </a>
        </div>

    </div>
</body>
</html>
