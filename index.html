<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NagarSeva - Splash</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 flex items-center justify-center min-h-screen">

    <!-- Mobile Frame Box matching exact dark brown aesthetic -->
    <div class="w-[360px] h-[715px] bg-[#3B2922] text-white rounded-[40px] p-6 flex flex-col items-center justify-between shadow-2xl border-4 border-slate-800 relative overflow-hidden font-sans">
        
        <div class="w-full"></div>

        <!-- Center Logo Box and Text -->
        <div class="text-center space-y-4">
            <div class="w-28 h-28 bg-[#FAF8F5] rounded-3xl mx-auto flex items-center justify-center shadow-xl p-1.5 border-2 border-amber-900/30 overflow-hidden">
                <!-- Yahan .jpeg kar diya hai -->
                <img src="logo.jpeg" alt="Nagar Seva Logo" class="w-full h-full object-contain rounded-2xl">
            </div>
            <div>
                <h1 class="text-2xl font-serif tracking-wide text-white font-medium">Trusted Services,</h1>
                <h1 class="text-2xl font-serif tracking-wide text-white italic font-light">Stronger Communities.</h1>
            </div>
        </div>

        <!-- Bottom Footer Indicator -->
        <div class="text-center pb-6 space-y-3">
            <div class="flex justify-center space-x-1.5">
                <div class="w-1.5 h-1.5 bg-white/40 rounded-full"></div>
                <div class="w-1.5 h-1.5 bg-white/40 rounded-full"></div>
                <div class="w-1.5 h-1.5 bg-white rounded-full"></div>
            </div>
            <p class="text-[9px] text-white/60 uppercase tracking-widest font-semibold">POWERED BY COMMUNITY</p>
        </div>

    </div>

    <script>
        // 2 second baad automatically login page par bhej dega
        setTimeout(function() {
            window.location.href = 'welcome.html';
        }, 2000);
    </script>
</body>
</html>
